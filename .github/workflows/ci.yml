name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Install tools the tests use
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends samba-common-bin acl
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race ./...
      - name: Release version rules
        run: ./scripts/next-version_test.sh

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - run: npm ci
      - run: CI=true npm test -- --watchAll=false
      - run: CI=true npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [go, ui]
    steps:
      - uses: actions/checkout@v4
      - name: End-to-end test (Docker + real Samba)
        run: ./scripts/e2e.sh

  # Every push to master that passes the jobs above is released automatically.
  # The version comes from the commit titles since the last release (see
  # scripts/next-version.sh); docs/ci/chore-only changes do not create one.
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [go, ui, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide the version
        id: version
        run: |
          version=$(./scripts/next-version.sh)
          if [ -z "$version" ]; then
            echo "No release-worthy commits since the last release."
          else
            echo "Releasing $version"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "minor=$(echo "$version" | cut -d. -f1,2)" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.version.outputs.version
        with:
          node-version: "20"
      - uses: actions/setup-go@v5
        if: steps.version.outputs.version
        with:
          go-version: "1.23"

      - name: Build binaries
        if: steps.version.outputs.version
        run: |
          cd gui
          npm ci
          npm pkg set version="${VERSION#v}"
          REACT_APP_BUILD_DATE=$(date +%F) npm run build
          cd ..
          make dist VERSION="$VERSION"
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - uses: docker/setup-qemu-action@v3
        if: steps.version.outputs.version
      - uses: docker/setup-buildx-action@v3
        if: steps.version.outputs.version
      - uses: docker/login-action@v3
        if: steps.version.outputs.version
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        if: steps.version.outputs.version
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.minor }}
            ghcr.io/${{ github.repository }}:latest

      # Creating the release also creates the tag, so it comes last: a failure
      # earlier leaves no tag and the next push tries the same version again.
      - name: Publish GitHub release
        if: steps.version.outputs.version
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$VERSION" dist/* \
            --target "$GITHUB_SHA" --title "$VERSION" --generate-notes
